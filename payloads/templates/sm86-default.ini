; DLSSG SM86 - frame generation for Ampere (RTX 30) and newer.
; Deploy only one proxy (version.dll, or a single name from alternatives\) plus this INI beside the
; rendering EXE. If several of this package's proxies end up in one folder the first one the game
; loads runs the mod and the others only forward, so nothing breaks - but one is enough.
; The DLSS-G runtime, models and backends are all embedded in the proxy DLL. Restart the game after changing this.
; RTX 20 (Turing) works with this file unchanged: the kernel family is picked from the physical GPU
; and resolves to SM75. The advanced keys (SM75Family / SpoofArchToGame and the capture/diagnostic
; knobs) are not written here because their defaults are already correct.

[General]
; 1 = frame generation on (the bundled, Ampere-optimized DLSS-G runtime). 0 = off: the game's own
; DLSS-G loads unchanged, which means no frame generation on Ampere.
Enabled=1

[FrameGeneration]
; Kernel consistency tier: how far the generated image may move from what the official NVIDIA runtime
; would produce. Higher is faster and further from the official output.
; 0 = stock kernels, the runtime's original numerics only (most conservative).
; 1 = every acceleration that keeps the output bit-identical to the official runtime (recommended, default).
; 2 = tier 1 plus the lossy image kernels that stay above ~50 dB PSNR against the official output; 310.9 build only.
; 3 = everything lossy that is still faster (largest quality cost, fastest).
; Tiers 2 and 3 are not bit-exact; a 310.1 build runs tiers 2/3 as 1.
Optimized=1
; Frame-generation multiplier ceiling: 3 = up to 4X (factory default), 5 = up to 6X on the 310.9 build only.
; The game requests its own count within this; a game with dynamic MFG otherwise runs at the maximum by
; default, which users found too high (issues #497/#499). A game whose own Streamline plugin is 4X stays
; at 4X either way. Clamped to what the bundled runtime supports: 6X on 310.9, 4X on 310.1.
MaxGeneratedFrames=3

[Logging]
; 0 = off, 1 = errors, 2 = configuration and capability, 3 = kernel and evaluation traces.
Level=1
Directory=dlssg_sm86\logs

[Runtime]
; Bundled = always use the embedded, matched runtime and backend (normal use).
Mode=Bundled
; Empty uses %LOCALAPPDATA%\DlssgSm86\bundles. A relative path is based on this INI's folder.
CacheDirectory=
