; DLSSG SM86 - frame generation and super-resolution for Ampere (RTX 30) and Turing (RTX 20).
; Copy version.dll, this INI and the whole dlssg_sm86\ folder beside the rendering EXE.
; Use ONE proxy DLL at a time: version.dll first. Only if the game never loads it, delete it and try the
; proxies in alternatives\ one by one, in this order: winmm.dll, dbghelp.dll, dinput8.dll, then dxgi.dll
; or d3d12.dll (render-path proxies: last resort, never both).
; The DLSS-G runtime, the SM86/SM75 backend and the kernel packs are FILES under dlssg_sm86\, found
; relative to the proxy's own folder - nothing is embedded and nothing is ever written to %LOCALAPPDATA%.
; Restart the game after changing this file. This is the full release configuration; every diagnostic /
; compatibility / performance knob still works but is left out here and takes its safe, validated default.
; RTX 20 (Turing) works with this file unchanged: the kernel family is picked from the physical GPU and
; resolves to SM75, and the architecture gate the game applies is handled automatically.
; Two frame-generation engines: common keys live in [FrameGeneration] / [Runtime] / [Logging], DLSS-only
; keys in [DLSSG], XeSS-only keys in [XeSSFG]. The other engine's keys are not read.

[General]
; 1 = frame generation on (the bundled, Ampere-optimized DLSS-G runtime). 0 = off: the game's own DLSS-G
; loads unchanged, which means no frame generation on Ampere. The proxy still forwards the real system DLL.
Enabled=1

[FrameGeneration]
; Engine: DLSS = NVIDIA's DLSS-G model on this project's SM86/SM75 kernels (default). XeSS = Intel's
; XeSS-FG model on this project's own runner (dlssg_sm86\xefg\xefg_kernels.dll; Intel's libxess_fg.dll is
; not used), 2X only. A back buffer it cannot run (RGBA16F) falls back to DLSS by itself.
Engine=DLSS
; Frame-generation multiplier ceiling: 3 = up to 4X (factory default), 5 = up to 6X. Engine=XeSS clamps
; it to 1 (2X). The game requests its own count within this; a game with dynamic MFG otherwise runs at
; the maximum by default, which users found too high (issues #497/#499). A game whose own Streamline
; plugin is 4X stays at 4X either way. Clamped to what the bundled runtime (310.9.16) supports: 6X.
MaxGeneratedFrames=3

[DLSSG]
; Read only by Engine=DLSS.
; Consistency tier: how far the generated image may move from what the official NVIDIA runtime produces.
; 0 = stock, the runtime's original numerics only (most conservative).
; 1 = every acceleration that keeps the output BIT-IDENTICAL to the official runtime.
; 2 = tier 1 plus lossy image kernels (default). Not bit-identical: 44-53 dB PSNR against the official
;     output on real 4K captures, lowest on the fastest motion; side by side against ground truth, no
;     difference from tier 1 was visible.
; 3 = everything lossy that is still faster (largest quality cost, fastest).
Optimized=2
; DLSS-G render preset. Auto = let the game / driver profile decide (default). A = force UI recomposition
; off. B = force it on (cleaner HUD/UI inside generated frames), but B only takes effect when the game
; hands DLSS-G both a HUD-less image and a UI plane; most games do not, and then B is a no-op.
; C = FG Lite (opt-in): lighter candidate blending, about 32-54 % less GPU time per generated frame,
; slightly lower image quality (mostly on the HUD and at occlusion edges); uses this project's
; accelerated kernels like the default.
Preset=Auto

[XeSSFG]
; Read only by Engine=XeSS.
; Optical-flow resolution: Coarse / Middle / Fine; finer is slower.
FlowResolution=Middle
; 1 = when the game supplies a HUD-less image, feed it to the network and composite the UI (default);
; 0 = never. A game that supplies none runs as 0.
UseHudless=1

[Logging]
; 0 = off, 1 = errors, 2 = configuration and capability, 3 = kernel and evaluation traces.
Level=1
Directory=dlssg_sm86\logs

[Runtime]
; Bundled = the packaged runtime beside this INI, dlssg_sm86\runtime\nvngx_dlssg.dll, with its backend
; (normal use; no game DLL version matching). External / Pinned are advanced. Auto was removed in 0.4.0
; (it runs as Bundled). With [DLSSG] Preset=C, a Pinned / External runtime that cannot do C is replaced
; by the bundled one, so C always takes effect.
Mode=Bundled
