; DLSSG SM86 - frame generation and super-resolution for Ampere (RTX 30) and Turing (RTX 20).
; Copy version.dll, this INI and the whole dlssg_sm86\ folder beside the rendering EXE.
; Use ONE proxy DLL at a time: version.dll first. Only if the game never loads it, delete it and try the
; proxies in alternatives\ one by one, in this order: winmm.dll, dbghelp.dll, dinput8.dll, then dxgi.dll
; or d3d12.dll (render-path proxies: last resort, never both).
; The DLSS-G runtime, the SM86/SM75 backend, the kernel packs and the super-resolution snippet are FILES
; under dlssg_sm86\, found relative to the proxy's own folder - nothing is embedded and nothing is ever
; written to %LOCALAPPDATA%. Restart the game after changing this file.
; This is the full release configuration. Every diagnostic / compatibility / performance knob still works
; but is left out here and takes its safe, validated default; the complete list is in docs\INSTALL.md.
; A value that is invalid or out of range is NOT replaced by a default: the log gets one
; configuration_invalid and the feature it belongs to is not enabled (frame generation as with Enabled=0,
; super resolution as with Mode=Off).
; RTX 20 (Turing) works with this file unchanged: the kernel family is picked from the physical GPU and
; resolves to SM75, and the architecture gate the game applies is handled automatically.
; Two frame-generation engines: common keys live in [FrameGeneration] / [Runtime] / [Logging], DLSS-only
; keys in [DLSSG], XeSS-only keys in [XeSSFG]. The other engine's keys are not read.

[General]
; 1 = frame generation on (the bundled, Ampere-optimized DLSS-G runtime). 0 = off: the game's own DLSS-G
; loads unchanged, which means no frame generation on Ampere. The proxy still forwards the real system DLL.
Enabled=1

[FrameGeneration]
; Engine: DLSS = NVIDIA's DLSS-G model on this project's SM86/SM75 kernels (default). XeSS = Intel's
; XeSS-FG model 15 (as ported by MFG-Unlocker 1.6.0; its 2X is model 18) on this project's own runner
; (dlssg_sm86\xefg\xefg_kernels.dll; Intel's libxess_fg.dll is not used): 2X / 3X / 4X. A back buffer it
; cannot run (RGBA16F) is refused, it never falls back to DLSS.
Engine=DLSS
; Generated frames per real frame: 3 = 4X (factory default), 5 = 6X (the most the bundled runtime
; 310.9.16 supports). A requirement, not a hint: it is advertised to the game exactly (a driver profile
; cannot lower it), and the game's own menu may pick less. Where it cannot be served (above 5, above 3
; under Engine=XeSS, an old 2X-only game plugin) frame generation is not enabled and the log says why
; (max_generated_frames_unsupported). A game whose own Streamline plugin is 4X stays at 4X either way.
MaxGeneratedFrames=3

[DLSSG]
; Read only by Engine=DLSS.
; Consistency tier: how far the generated image may move from what the official NVIDIA runtime would
; produce. The old places [FrameGeneration] Optimized / [Compatibility] OptimizedKernels are no longer
; read. A higher number is faster and further from the official image.
; 0 = stock, the runtime's original numerics only (most conservative).
; 1 = every acceleration that keeps the output BIT-IDENTICAL to the official runtime (default).
; 2 = tier 1 plus lossy image kernels. Not bit-identical: 44-53 dB PSNR against the official output on
;     real 4K captures, lowest on the fastest motion; side by side against ground truth, no difference
;     from tier 1 was visible.
; 3 = everything lossy that is still faster (largest quality cost, fastest).
Optimized=1
; DLSS-G render preset. What is written here runs, whatever the game or a driver profile asks for.
; A (default) = UI recomposition off, FG Lite off.
; B = UI recomposition on (cleaner HUD/UI inside generated frames), but only when the game hands DLSS-G
;     both a HUD-less image and a UI plane; most games do not, and then B looks like A.
; C = FG Lite: lighter candidate blending, about 32-54 % less GPU time per generated frame, slightly
;     lower image quality (mostly on the HUD and at occlusion edges); uses this project's accelerated
;     kernels like the default.
; Auto was removed on 2026-10-22 (it runs as A); the old place [Compatibility] Preset is no longer read.
Preset=A

[XeSSFG]
; Read only by Engine=XeSS.
; Optical-flow resolution: Coarse / Middle / Fine; finer is slower.
; CoarseAt4K = Coarse when the output has >= 3840x2160 pixels, else Middle.
FlowResolution=Middle
; Auto = when the game supplies a HUD-less image, feed it to the network and composite the UI, else run
; as 0 (default); 1 = always (a game that supplies none ends with an error); 0 = never.
UseHudless=Auto
; The model is Intel's model 15 as ported by MFG-Unlocker 1.6.0 - MIT; 46 of its programs fall under
; Intel's XeSS SDK terms (THIRD_PARTY_NOTICES.txt). Its 2X is model 18. It ships inside
; xefg_kernels.dll. The Model key was removed on 2026-10-26 and is not read.

[Logging]
; 0 = off, 1 = errors, 2 = configuration and capability, 3 = kernel and evaluation traces.
; One file, Directory\dlssg_sm86.log, shared by every module of every process; each line starts with the
; local time, pid, EXE name and level letter (E = 1, I = 2, D = 3), then the JSON record. Filter by EXE
; name or pid for one game. FrameTiming=1 additionally writes frame_timing.txt for per-frame GPU times.
Level=1
Directory=dlssg_sm86\logs

[Runtime]
; Bundled = the packaged runtime beside this INI, dlssg_sm86\runtime\nvngx_dlssg.dll, with its backend
; (normal use; no game DLL version matching). External / Pinned are advanced, see docs\INSTALL.md. Auto
; was removed in 0.4.0 (it runs as Bundled). A runtime that cannot be used - the packaged one missing, or
; a Path that names a wrong file - turns frame generation off with one error in the log; nothing else is
; loaded in its place.
Mode=Bundled

[SuperResolution]
; DLSS Super Resolution, RTX 30 / RTX 20 only. Off = not touched (default).
; M-INT8 / L-INT8 = preset M / L on every quality mode (the game's menu picks the mode), run on this
; project's INT8 kernels; M-FP16 / L-FP16 = the same preset on NVIDIA's own kernels. On Quality /
; Balanced / DLAA, M or L is slower than the game's own preset K.
; Needs dlssg_sm86\sr\ from the complete release package, not the repository.
Mode=Off
